# Run from the repository root. The fixture is synthetic and has no side effects.
servers:
  demo:
    command: ["uv", "run", "python", "-m", "mcp_guard.demo_server", "--case", "benign-weather"]
policy:
  tools: []
  servers:
    - match: demo
      allow: true
      rate: {calls: 30, seconds: 60}
  resources:
    - match: "mcp-guard://demo/*"
      allow: true
  prompts:
    - match: "demo__summary"
      allow: true
      arguments:
        topic: {regex: "[a-zA-Z ]{1,80}"}

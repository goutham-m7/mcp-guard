[project]
name = "mcp-guard"
version = "0.2.0"
description = "A default-deny MCP security proxy with policy inheritance and reproducible evaluation"
readme = "README.md"
authors = [
    { name = "Goutham Madineni", email = "151193576+goutham-m7@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "security", "proxy", "prompt-injection"]
dependencies = [
    "aiohttp>=3.14.5",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[project.urls]
Repository = "https://github.com/goutham-m7/mcp-guard"
Changelog = "https://github.com/goutham-m7/mcp-guard/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
